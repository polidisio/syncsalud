name: Synctrackers
options:
  bundleIdPrefix: com.saraiba
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  developmentLanguage: es

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: "DQ7D6387N8"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Synctrackers iOS:
    type: application
    platform: iOS
    sources:
      - path: SyncSalud
        excludes:
          - "API/**/*"
          - "Info*.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saraiba.synctrackers
        PRODUCT_NAME: Synctrackers
        INFOPLIST_FILE: SyncSalud/Info-iOS.plist
        CODE_SIGN_ENTITLEMENTS: SyncSalud/Synctrackers-iOS.entitlements
        SDKROOT: iphoneos
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: NO
        SWIFT_EMIT_LOC_STRINGS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  SynctrackersMac:
    type: application
    platform: macOS
    sources:
      - path: SyncSalud
        excludes:
          - "Info*.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saraiba.synctrackers.mac
        PRODUCT_NAME: Synctrackers
        INFOPLIST_FILE: SyncSalud/Info-macOS.plist
        CODE_SIGN_ENTITLEMENTS: SyncSalud/Synctrackers-macOS.entitlements
        SDKROOT: macosx
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
